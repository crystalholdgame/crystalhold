name: Build Android app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is missing - the release build will be unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > key.b64
          echo "Base64 length after cleanup: $(wc -c < key.b64) (expected 3512)"
          base64 -d key.b64 > app/upload.jks
          rm key.b64
          if keytool -list -keystore app/upload.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "Signing key OK"
          else
            echo "::error::The signing key or KEYSTORE_PASSWORD is wrong. Re-paste KEYSTORE_BASE64 (whole file upload.jks.base64.txt) and the password."
            exit 1
          fi

      - name: Build app bundle (AAB) and test APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug

      - name: Upload the results
        uses: actions/upload-artifact@v4
        with:
          name: crystalhold-build-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
