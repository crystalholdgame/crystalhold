<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>حراس الكريستال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-screen portrait game — HUD strip, 3D battlefield (WebGL + 2D overlay), command dock; menus as full-screen panels. Deliberate single dark "oak & bronze" theme. */
:root{
  --bg:#15100b; --wood:#2b2016; --wood-2:#3d2e20; --rim:#6e5434; --gold:#e9b44c; --gold-2:#ffd98a;
  --parch:#f3e6c8; --leaf:#8cc152; --blood:#d8483f; --steel:#a9bccd; --dim:#bba98a;
  --f-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --f-body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--parch);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app.in-menu .hud,#app.in-menu .dock{visibility:hidden}
.wood{background:linear-gradient(180deg,var(--wood-2),var(--wood));border:1px solid var(--rim);box-shadow:inset 0 1px 0 rgba(255,220,160,.12),0 2px 6px rgba(0,0,0,.35)}
.hud{display:flex;align-items:center;gap:6px;min-height:40px}
.stat{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;line-height:1}
.stat svg{width:17px;height:17px;flex:none}
.stat.lives svg{color:var(--blood)} .stat.gold svg{color:var(--gold)} .stat.wave svg{color:var(--steel)}
.stat.lives.low{animation:lowpulse .7s infinite alternate}
.hud-btns{margin-inline-start:auto;display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.icon-btn svg{width:18px;height:18px}
[dir="ltr"] .icon-btn.back svg{transform:scaleX(-1)}
.icon-btn:active{transform:scale(.94)}
#stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#a8c4a0;box-shadow:0 0 0 1px var(--rim),0 6px 20px rgba(0,0,0,.5)}
#game,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none}
#fx{pointer-events:none}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);font-weight:700;line-height:1.6}
#banner{position:absolute;left:0;right:0;top:16%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;opacity:0;text-align:center;padding-inline:12px}
#banner b{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.1;color:var(--gold-2);text-shadow:0 3px 0 #4a2a0a,0 0 18px rgba(0,0,0,.8)}
#banner span{font-weight:800;font-size:14px;color:var(--parch);background:rgba(20,14,8,.82);border:1px solid var(--rim);padding:4px 12px;border-radius:999px;max-width:100%}
#banner.show{animation:bannerIn 2.4s ease forwards}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;max-width:92%;padding:8px 14px;border-radius:12px;background:rgba(20,14,8,.88);border:1px solid var(--gold);font-weight:800;font-size:14px;text-align:center;pointer-events:none;animation:hintBob 1.4s ease-in-out infinite}
.dock{display:flex;align-items:center;gap:7px;padding-bottom:15px}
.hero-btn{position:relative;width:56px;height:56px;flex:none;border-radius:50%;padding:3px;border:0;background:conic-gradient(var(--hpc,#8cc152) calc(var(--hp,1)*360deg),rgba(0,0,0,.5) 0)}
.hero-btn canvas{width:50px;height:50px;border-radius:50%;display:block;background:radial-gradient(circle at 40% 30%,#4a3a28,#1d150d)}
.hero-btn .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;background:var(--gold);color:#2a1600;padding:1px 6px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hero-btn .dead{position:absolute;inset:3px;border-radius:50%;background:rgba(10,6,3,.72);display:grid;place-items:center;font-weight:800;font-size:16px}
.skills{display:flex;gap:6px;flex:none}
.skill{position:relative;width:48px;height:48px;border-radius:14px;border:1.5px solid var(--rim);background:radial-gradient(circle at 35% 25%,#4b3925,#1e160e 75%);display:grid;place-items:center;flex:none;padding:0;color:var(--c,#fff)}
.skill .sk-ico svg{width:24px;height:24px;display:block}
.skill .sk-cd{position:absolute;inset:-1px;border-radius:14px;background:conic-gradient(rgba(10,6,3,.82) calc(var(--p,0) * 360deg),transparent 0);pointer-events:none}
.skill .sk-num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;pointer-events:none;font-variant-numeric:tabular-nums}
.skill .sk-name{position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--dim);white-space:nowrap}
.skill.ready{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
.skill.arming{animation:arm .45s infinite alternate}
.skill.off{opacity:.35;filter:grayscale(1)}
.wave-btn{flex:1;min-width:0;height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffdc8f,#e39a34 60%,#c4781f);color:#2a1300;box-shadow:inset 0 1px 0 #fff3c8,0 5px 0 #7d4610,0 8px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding-inline:6px}
.wave-btn .wb-main{font-family:var(--f-display);font-size:18px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wave-btn .wb-sub{font-size:11.5px;font-weight:800;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.wave-btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 1px 0 #fff3c8,0 1px 0 #7d4610}
.wave-btn:disabled{background:linear-gradient(180deg,#4a3a28,#2f2418);color:var(--dim);box-shadow:0 5px 0 #17110b}
.wave-btn.pulse{animation:wpulse 1.1s ease-in-out infinite}
.sheet{position:absolute;z-index:10;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:8px;padding:12px;border-radius:18px;background:linear-gradient(180deg,rgba(61,46,32,.97),rgba(33,24,16,.97));border:1.5px solid var(--rim);box-shadow:0 -10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,160,.15);animation:sheetUp .18s ease-out}
.sheet.top{bottom:auto;top:56px;animation-name:sheetDown}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--gold-2)}
.sheet-head .x{margin-inline-start:auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--rim);background:rgba(0,0,0,.2);font-size:18px;line-height:1}
.tower-list{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.tower-list::-webkit-scrollbar{display:none}
.tcard{position:relative;flex:none;width:100px;scroll-snap-align:start;padding:8px 6px;border-radius:14px;border:1.5px solid var(--rim);background:linear-gradient(180deg,rgba(255,230,180,.08),rgba(0,0,0,.15));display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tcard canvas{width:54px;height:54px}
.tcard .tname{font-weight:800;font-size:13.5px;line-height:1.2}
.tcard .tcost{display:flex;align-items:center;gap:3px;font-weight:800;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.tcard .tcost svg{width:13px;height:13px}
.tcard .tdesc{font-size:10.5px;line-height:1.3;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.tcard.poor .tcost{color:var(--blood)}
.tcard.poor{opacity:.75}
.tcard.locked{opacity:.4;filter:grayscale(.9)}
.tcard .tlock{position:absolute;top:6px;inset-inline-start:6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:999px}
.tcard:active{transform:scale(.96)}
.tcard.nope{animation:nope .3s}
#tsIcon{width:48px;height:48px;flex:none}
.ts-title{display:flex;flex-direction:column;gap:2px}
.ts-title b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1;color:var(--gold-2)}
.ts-title span{font-size:12px;color:var(--dim);font-weight:700}
#tsDesc{margin:0 0 8px;font-size:13px;color:var(--dim);line-height:1.5}
.ts-stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:flex;align-items:baseline;gap:5px;padding:5px 9px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(110,84,52,.5);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.chip b{color:var(--parch);font-size:14px}
.chip i{font-style:normal;color:var(--leaf);font-weight:800}
.ts-actions{display:flex;gap:8px}
.ts-actions button{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--rim);background:rgba(0,0,0,.22);font-weight:800;font-size:14px;line-height:1.1}
.ts-actions .up{flex:1.4;border:0;background:linear-gradient(180deg,#a8e06a,#5e9a2c);color:#122404;box-shadow:inset 0 1px 0 #e3ffbf,0 4px 0 #35591a}
.ts-actions .up:disabled{background:#3a2d20;color:var(--dim);box-shadow:none}
.ts-actions .sell{color:var(--gold)}
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:14px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(120% 80% at 50% 40%,rgba(21,16,11,.3),rgba(21,16,11,.9));overflow-y:auto;text-align:center}
.screen.scroll{justify-content:flex-start;background:rgba(21,16,11,.93)}
.crest{width:84px;height:98px;position:relative;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));animation:float 3.2s ease-in-out infinite}
.crest::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);background:linear-gradient(160deg,#ffe3a0,#d39a35 45%,#7d4a12)}
.crest::after{content:"";position:absolute;inset:7px;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);background:linear-gradient(180deg,#2f5e8f,#173452)}
.crest i{position:absolute;z-index:1;left:50%;top:20px;width:28px;height:42px;transform:translateX(-50%);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);background:linear-gradient(115deg,#e9fffa,#6ff0c8 45%,#1b8f78)}
.title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(46px,13vw,72px);line-height:.98;text-wrap:balance;background:linear-gradient(180deg,#fff6dc 5%,#ffd27a 45%,#c47a1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a1f05) drop-shadow(0 0 24px rgba(0,0,0,.7))}
.tagline{margin:0;max-width:32ch;font-size:15.5px;line-height:1.6;opacity:.95;text-shadow:0 1px 4px #000}
.foot{margin:0;font-size:13px;color:var(--dim);font-weight:700;text-shadow:0 1px 4px #000}
.btn{font-family:var(--f-display);font-size:24px;min-width:200px;padding:12px 30px;border-radius:16px;border:0;background:linear-gradient(180deg,#ffdc8f,#e39a34 60%,#c4781f);color:#2a1300;box-shadow:inset 0 1px 0 #fff3c8,0 6px 0 #7d4610,0 12px 26px rgba(0,0,0,.5)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 1px 0 #fff3c8,0 1px 0 #7d4610}
.btn:disabled{filter:grayscale(.8);opacity:.6}
.btn.ghost{font-family:var(--f-body);font-weight:800;font-size:16px;padding:11px 24px;background:linear-gradient(180deg,var(--wood-2),var(--wood));color:var(--parch);border:1px solid var(--rim);box-shadow:0 3px 0 #120d08}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row .btn.ghost{min-width:0;font-size:14px;padding:9px 14px}
.lang-row button{min-width:0;padding:7px 12px;border-radius:10px;border:1px solid var(--rim);background:rgba(0,0,0,.3);font-weight:800;font-size:14px}
.lang-row button.on{background:var(--gold);color:#2a1600;border-color:var(--gold)}
.star-total{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--gold-2);text-shadow:0 1px 4px #000}
.star-total svg{width:18px;height:18px;fill:var(--gold)}
.scr-head{display:flex;align-items:center;gap:10px;width:100%;max-width:520px}
.scr-head h2,.scr-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;color:var(--gold-2);text-shadow:0 3px 0 #3a1f05;text-wrap:balance}
.scr-head .star-total{margin-inline-start:auto}
.scr-title.lose{color:#ff8a7a}
.sec-label{width:100%;max-width:520px;text-align:start;font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.3px;margin-top:2px}
.hero-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.hcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px;border-radius:16px;border:1.5px solid var(--rim);background:linear-gradient(180deg,rgba(61,46,32,.9),rgba(33,24,16,.9));text-align:center}
.hcard.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(233,180,76,.35),0 0 20px rgba(233,180,76,.25)}
.hcard canvas{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#4a3a28,#1d150d)}
.hcard b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--gold-2);line-height:1.1}
.hcard .hl{font-size:12px;font-weight:800;color:var(--leaf)}
.hcard .hs{font-size:10.5px;color:var(--dim);line-height:1.4}
.region-tabs{display:flex;gap:6px;width:100%;max-width:520px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.region-tabs::-webkit-scrollbar{display:none}
.rtab{flex:none;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--rim);background:rgba(0,0,0,.3);font-family:var(--f-display);font-size:19px;color:var(--parch);position:relative}
.rtab.on{background:var(--gold);color:#2a1600;border-color:var(--gold)}
.rtab.locked{opacity:.35}
.region-head{display:flex;align-items:baseline;justify-content:space-between;width:100%;max-width:520px;gap:8px}
.region-head b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold-2)}
.region-head span{font-size:13px;color:var(--dim);font-weight:800;font-variant-numeric:tabular-nums}
.level-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;max-width:520px}
.ltile{position:relative;aspect-ratio:1/1.05;max-width:100%;border-radius:14px;border:1.5px solid var(--rim);background:linear-gradient(180deg,rgba(61,46,32,.95),rgba(33,24,16,.95));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.ltile .n{font-family:var(--f-display);font-size:22px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.ltile .st{display:flex;gap:1px}
.ltile .st svg{width:11px;height:11px;fill:rgba(255,255,255,.15)}
.ltile .st svg.on{fill:var(--gold)}
.ltile.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(233,180,76,.4)}
.ltile.boss{background:linear-gradient(180deg,rgba(110,30,24,.95),rgba(50,14,10,.95));border-color:#a8422e}
.ltile .crown{position:absolute;top:3px;inset-inline-end:4px;width:13px;height:13px;fill:var(--gold)}
.ltile.locked{opacity:.38}
.ltile.locked .n{color:var(--dim)}
.lvl-info{width:100%;max-width:520px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;text-align:start;padding:12px;border-radius:16px;border:1.5px solid var(--rim);background:linear-gradient(180deg,rgba(61,46,32,.95),rgba(33,24,16,.95))}
.lvl-info canvas{grid-row:1/5;width:64px;height:92px;border-radius:8px}
.lvl-info h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--gold-2);line-height:1.15}
.lvl-info .meta{font-size:13px;color:var(--dim);font-weight:700}
.mods{display:flex;flex-wrap:wrap;gap:5px}
.mod{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(216,72,63,.18);border:1px solid rgba(216,72,63,.5);color:#ffb3a8}
.mod.boss{background:rgba(233,180,76,.18);border-color:rgba(233,180,76,.6);color:var(--gold-2)}
.lvl-info .go{grid-column:1/3;margin-top:8px;width:100%;min-width:0}
.lvl-info .go2{grid-column:1/3;width:100%;min-width:0;font-size:15px}
.ad-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;background:rgba(0,0,0,.35);color:var(--gold-2);padding:2px 7px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
.ad-badge svg{width:10px;height:10px;fill:currentColor}
.upg-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.upg{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:start;padding:10px 12px;border-radius:14px;border:1.5px solid var(--rim);background:linear-gradient(180deg,rgba(61,46,32,.95),rgba(33,24,16,.95))}
.upg b{font-size:15px}
.upg .d{font-size:12px;color:var(--dim);grid-column:1}
.upg .pips{display:flex;gap:4px;grid-column:1}
.upg .pips i{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.upg .pips i.on{background:var(--leaf)}
.upg button{grid-row:1/4;grid-column:2;min-width:74px;height:44px;border-radius:12px;border:0;background:linear-gradient(180deg,#ffdc8f,#e39a34);color:#2a1300;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 #7d4610}
.upg button svg{width:14px;height:14px;fill:#7a4d0c}
.upg button:disabled{background:#3a2d20;color:var(--dim);box-shadow:none}
.upg button:disabled svg{fill:var(--dim)}
.upg-hint{margin:0;max-width:520px;font-size:13px;color:var(--dim);line-height:1.5}
.end-stars{display:flex;gap:8px;align-items:flex-end}
.end-stars svg{width:54px;height:54px;fill:rgba(255,255,255,.12);transform:scale(.4);opacity:0;animation:starPop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.end-stars svg:nth-child(2){width:68px;height:68px;animation-delay:.25s}
.end-stars svg:nth-child(3){animation-delay:.5s}
.end-stars svg.on{fill:var(--gold);filter:drop-shadow(0 0 10px rgba(233,180,76,.7))}
.end-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#endSub{margin:0;color:var(--dim);font-size:15px;max-width:34ch;line-height:1.5}
.end-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
@keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes hintBob{50%{transform:translate(-50%,-4px)}}
@keyframes wpulse{50%{box-shadow:inset 0 1px 0 #fff3c8,0 5px 0 #7d4610,0 0 0 5px rgba(233,180,76,.25),0 8px 24px rgba(233,150,40,.5)}}
@keyframes arm{to{box-shadow:0 0 0 4px rgba(255,140,60,.4),0 0 20px rgba(255,140,60,.7)}}
@keyframes lowpulse{to{background:rgba(216,72,63,.35)}}
@keyframes sheetUp{from{transform:translateY(20px);opacity:0}}
@keyframes sheetDown{from{transform:translateY(-20px);opacity:0}}

const BASE_PATHS=[[[4,-1],[4,2],[1,2],[1,6],[7,6],[7,10],[4,10],[4,12]],[[1,-1],[1,3],[7,3],[7,5],[1,5],[1,8],[7,8],[7,11],[4,11],[4,12]],[[-1,1],[6,1],[6,4],[2,4],[2,8],[7,8],[7,11],[4,11]],[[7,-1],[7,2],[1,2],[1,10],[7,10],[7,5],[4,5],[4,7]],[[0,-1],[0,3],[3,3],[3,0],[6,0],[6,6],[2,6],[2,9],[8,9],[8,12]],[[4,-1],[4,1],[0,1],[0,4],[8,4],[8,7],[0,7],[0,10],[5,10],[5,12]]];
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function genPath(i){
  if(i<6)return BASE_PATHS[i];
  const rnd=rng32(i*104729+7);
  for(let attempt=0;attempt<6000;attempt++){
    const target=24+Math.floor(rnd()*15);
    let x,y,dx,dy;const sd=rnd();
    if(sd<.6){x=1+Math.floor(rnd()*7);y=-1;dx=0;dy=1;}else if(sd<.8){x=-1;y=Math.floor(rnd()*4);dx=1;dy=0;}else{x=COLS;y=Math.floor(rnd()*4);dx=-1;dy=0;}
    const pts=[[x,y]],cells=new Set(),order=[];let len=0,ok=true,first=true;
    while(len<target){
      const segLen=first?2+Math.floor(rnd()*3):2+Math.floor(rnd()*5);let moved=0;
      for(let s=0;s<segLen;s++){
        const nx=x+dx,ny=y+dy;if(nx<0||nx>=COLS||ny<0||ny>=ROWS)break;
        if(cells.has(nx+','+ny)){ok=false;break;}
        let bad=false;for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){const qx=nx+ax,qy=ny+ay;if(cells.has(qx+','+qy)&&!(qx===x&&qy===y))bad=true;}
        if(bad)break;
        x=nx;y=ny;cells.add(x+','+y);order.push([x,y]);moved++;len++;
      }
      if(!ok||moved===0||(first&&moved<2)){ok=false;break;}
      first=false;pts.push([x,y]);
      const turn=rnd()<.5?1:-1;const ndx=-dy*turn,ndy=dx*turn;dx=ndx;dy=ndy;
    }
    if(!ok||len<target||y<5)continue;
    const recent=new Set(order.slice(-2).map(c=>c.join(',')));let clash=false;
    for(let ax=-1;ax<=1;ax++)for(let ay=-1;ay<=1;ay++){const k=(x+ax)+','+(y+ay);if(cells.has(k)&&!recent.has(k))clash=true;}
    if(clash)continue;
    return pts;
  }
  return BASE_PATHS[i%6];
}
const LVCACHE={};
function getLevel(i){
  if(LVCACHE[i])return LVCACHE[i];
  const rnd=rng32(i*7717+31),region=Math.floor(i/10),boss=i%10===9;
  const mods=[];
  if(i>=8){let n=0;const r=rnd();if(i<30)n=r<.5?1:0;else if(i<60)n=r<.35?2:1;else n=r<.7?2:1;if(i>=90)n=2;
    const pool=Object.keys(MODS).filter(m=>!(m==='fragile'&&i<40)&&!(m==='regen'&&i<20)&&!(m==='elite'&&i<25));
    while(mods.length<n&&pool.length){const k=pool.splice(Math.floor(rnd()*pool.length),1)[0];mods.push(k);}}
  const lv={i,region,theme:REGIONS[region].theme,boss,mods,waves:7+Math.floor(i*13/99),hp:1+3.7*Math.pow(i/99,.85),maxP:i<6?10+i:10+Math.floor(rnd()*5),
    name:tx(REGIONS[region].name)+' '+(i%10+1)};
  Object.defineProperty(lv,'path',{get(){return this._p||(this._p=genPath(i));}});
  return LVCACHE[i]=lv;
}

const AU={ctx:null,v:0,last:{},mstep:0,mnext:0};
function ensureAudio(){
  try{
    if(!AU.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=AU.ctx=new C();
      const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.25;
      const master=c.createGain();master.gain.value=.9;comp.connect(master);master.connect(c.destination);
      AU.sfx=c.createGain();AU.sfx.gain.value=S.sound?1:0;AU.sfx.connect(comp);
      AU.amb=c.createGain();AU.amb.gain.value=S.sound?1:0;AU.amb.connect(comp);
      AU.mus=c.createGain();AU.mus.gain.value=S.music?.3:0;AU.mus.connect(comp);
      const n=c.sampleRate*2,wb=c.createBuffer(1,n,c.sampleRate),bb=c.createBuffer(1,n,c.sampleRate),w=wb.getChannelData(0),b=bb.getChannelData(0);let l=0;
      for(let i=0;i<n;i++){w[i]=Math.random()*2-1;l=(l+.02*w[i])/1.02;b[i]=l*3.5;}AU.white=wb;AU.brown=bb;
      const ir=c.createBuffer(2,Math.floor(c.sampleRate*1.8),c.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3.2);}
      AU.rev=c.createConvolver();AU.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.45;AU.rev.connect(rg);rg.connect(comp);
      startAmbient();AU.mnext=c.currentTime+.2;setInterval(musicTick,100);
    }
    if(AU.ctx.state==='suspended')AU.ctx.resume();
  }catch(e){}
}

function pick(ev){
  const r=cvs.getBoundingClientRect(),nx=((ev.clientX-r.left)/r.width)*2-1,ny=-((ev.clientY-r.top)/r.height)*2+1;
  V.ray.setFromCamera(new THREE.Vector2(nx,ny),V.cam);
  const roots=[];for(const tw of G.towers){const R=live.get(tw);if(R)roots.push(R.root);}
  const hits=V.ray.intersectObjects(roots,true);for(const hit of hits){let o=hit.object;while(o&&!o.userData.tower)o=o.parent;if(o)return{tower:o.userData.tower};}
  const pt=new THREE.Vector3();if(V.ray.ray.intersectPlane(V.gp,pt))return{x:pt.x,y:pt.z};return null;
}

function closeSheets(){$('#buildSheet').hidden=true;$('#towerSheet').hidden=true;if(G){G.selected=null;G.buildCell=null;}}
function refreshTowerSheet(){
  const tw=G.selected;if(!tw)return;const D=TOWERS[tw.type],l=tw.lvl,n=l<2?l+1:null;
  $('#tsName').textContent=tx(D.name);$('#tsLvl').textContent=t('lvlOf',l+1)+(D.air?t('hitsAir'):t('groundOnly'));$('#tsDesc').textContent=tx(D.desc);
  const rows=[];const f=(lab,arr,mul,fmt=v=>Math.round(v))=>rows.push(`<div class="chip"><span>${t(lab)}</span><b>${fmt(arr[l]*mul)}</b>${n!==null?`<i>← ${fmt(arr[n]*mul)}</i>`:''}</div>`);
  f('st_dmg',D.dmg,G.bn.dmg);f('st_range',D.range,G.bn.range,v=>v.toFixed(1));f('st_rate',D.rate,1,v=>v.toFixed(2));
  if(D.splash)f('st_splash',D.splash,1,v=>v.toFixed(2));if(D.chain)f('st_chain',D.chain,1);if(D.slow)f('st_slow',D.slow,1,v=>Math.round(v*100)+'%');
  $('#tsStats').innerHTML=rows.join('');
  const up=$('#tsUp');if(n===null){up.disabled=true;up.textContent=t('maxLvl');}else{const c=tUpg(tw);up.disabled=G.gold<c;up.textContent=t('upgradeC',c);}
  $('#tsSell').textContent=t('sell',Math.floor(tw.invested*.6));
  const m=$('#tsMode');m.textContent=t('targetL',t(MODES[tw.mode]));m.disabled=tw.type==='frost';
  iconCanvas($('#tsIcon'),tw.type);
}
function build(type,card){
  ensureAudio();const D=TOWERS[type],bc=G.buildCell;if(!bc||G.over)return;
  if(G.L<D.unlock||G.gold<tCost(type)){card.classList.remove('nope');void card.offsetWidth;card.classList.add('nope');return;}
  G.gold-=tCost(type);const tw=addTower(type,bc.c,bc.r,0);smokeFx(tw.x,tw.y,8,.25,false,.1);debris(tw.x,tw.y,'#8a7a62',8,2.5,.1);sfx('build',tw.x);
  closeSheets();
  if(G.L===0&&!S.seenTut&&G.wave===0)showHint(t('tutWave'));
}
$('#tsUp').addEventListener('click',()=>{const tw=G.selected;if(!tw||tw.lvl>=2)return;const c=tUpg(tw);if(G.gold<c)return;G.gold-=c;tw.lvl++;tw.invested+=c;tw.born=G.time;
  burst(tw.x,tw.y,'#ffd98a',16,3.5,.1,.6,.6);ringFx(tw.x,tw.y,'#ffffff',.2,1,.45,.05);smokeFx(tw.x,tw.y,4,.2,false,.1);addText(tw.x,tw.y,t('upgradeFx'),'#ffd98a',.3,1.2);sfx('upgrade',tw.x);refreshTowerSheet();});
$('#tsSell').addEventListener('click',()=>{const tw=G.selected;if(!tw)return;const v=Math.floor(tw.invested*.6);G.gold+=v;G.towers=G.towers.filter(x=>x!==tw);delete G.tmap[tw.r*COLS+tw.c];
  smokeFx(tw.x,tw.y,10,.3,false,.2);debris(tw.x,tw.y,'#8a7a62',10,3,.3);addText(tw.x,tw.y,'+'+v,'#ffd36a',.3,.9);sfx('sell',tw.x);closeSheets();});
$('#tsMode').addEventListener('click',()=>{const tw=G.selected;if(!tw)return;tw.mode=(tw.mode+1)%3;sfx('ui');refreshTowerSheet();});
$('#closeBuild').addEventListener('click',closeSheets);$('#closeTower').addEventListener('click',closeSheets);
$('#heroBtn').addEventListener('click',()=>{if(!G||G.demo)return;sfx('ui');showHint(G.hero.dead?t('heroBack'):t('tutHero'));setTimeout(()=>showHint(null),2600);});
cvs.addEventListener('pointerdown',ev=>{
  ensureAudio();if(!G||G.demo||G.over||G.paused||!V.ready)return;
  const hit=pick(ev);if(!hit)return;
  if(G.targeting!==null&&G.targeting!==undefined){if(hit.tower)castTarget(hit.tower.x,hit.tower.y);else castTarget(hit.x,hit.y);return;}
  if(hit.tower){if(G.selected===hit.tower)closeSheets();else openTowerSheet(hit.tower);return;}
  const wx=hit.x,wy=hit.y,c=Math.floor(wx),rw=Math.floor(wy);
  if(c>=0&&c<COLS&&rw>=0&&rw<ROWS&&G.grid[rw][c]===4&&!G.tmap[rw*COLS+c]&&Math.hypot(wx-c-.5,wy-rw-.5)<.6){if(G.buildCell&&G.buildCell.c===c&&G.buildCell.r===rw)closeSheets();else openBuildSheet(c,rw);return;}
  if(!$('#buildSheet').hidden||!$('#towerSheet').hidden){closeSheets();return;}
  const h=G.hero;h.rx=Math.max(.2,Math.min(COLS-.2,wx));h.ry=Math.max(.2,Math.min(ROWS-.2,wy));if(!h.dead)h.moving=true;G.flag={x:h.rx,y:h.ry,t:1};sfx('ui');
});
function banner(main,sub){const b=$('#banner');b.innerHTML=`<b>${main}</b>${sub?`<span>${sub}</span>`:''}`;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
function showHint(s){const h=$('#hint');if(!s){h.hidden=true;return;}h.textContent=s;h.hidden=false;}
const SCREENS=['menu','levels','upgScr','pauseScr','endScr','reviveScr'];
function showScreen(id){SCREENS.forEach(s=>$('#'+s).hidden=s!==id);$('#app').classList.toggle('in-menu',['menu','levels','upgScr'].includes(id));if(id==='menu')$('#menuStars').textContent=`${totalStars()}/${NLEV*3}`;}
function demoLevel(){return Math.min(S.unlocked-1,NLEV-1);}
function toMenu(screen){closeSheets();showHint(null);newGame(demoLevel(),true);if(screen==='levels')renderLevels();showScreen(screen);}
/* language */
function applyLang(){
  const d=LANGS[LANG].dir;$('#app').setAttribute('dir',d);document.documentElement.setAttribute('lang',LANG);document.documentElement.setAttribute('dir',d);
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ta)));
  $('#langRow').innerHTML=Object.keys(LANGS).map(k=>`<button data-l="${k}" class="${k===LANG?'on':''}">${LANGS[k].label}</button>`).join('');
  $('#langRow').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{LANG=S.lang=b.dataset.l;save();sfx('ui');applyLang();}));
  soundLabel();renderStoreBtns();$('#menuStars').textContent=`${totalStars()}/${NLEV*3}`;
  for(const k in LVCACHE)LVCACHE[k].name=lvName(+k);
  if(G&&!G.demo){buildSkills();buildTowerList();waveKey='';lastHeroKey='';}
  if(!$('#levels').hidden)renderLevels();if(!$('#upgScr').hidden)renderUpg();
}
/* levels screen */
let curRegion=null;
function renderHeroes(){
  const box=$('#heroPick');box.innerHTML='';
  Object.keys(HEROES).forEach(id=>{const D=HEROES[id],b=document.createElement('button');b.className='hcard'+(S.hero===id?' on':'');
    b.innerHTML=`<canvas></canvas><b>${tx(D.name)}</b><span class="hl">${t('levelOfHero',heroLevel(S.xp[id]||0))}</span><span class="hs">${tx(D.desc)}<br>${D.skills.map(s=>tx(s.name)).join(' · ')}</span>`;
    b.addEventListener('click',()=>{S.hero=id;save();sfx('ui');renderHeroes();});box.appendChild(b);paintFace(b.querySelector('canvas'),id);});
}
function renderLevels(){
  renderHeroes();$('#lvStars').textContent=totalStars();
  S.sel=Math.min(S.sel||0,S.unlocked-1);if(curRegion===null)curRegion=Math.floor(S.sel/10);
  const tabs=$('#regionTabs');tabs.innerHTML='';
  for(let r=0;r<10;r++){const b=document.createElement('button');const lock=r*10>=S.unlocked;b.className='rtab'+(r===curRegion?' on':'')+(lock?' locked':'');b.textContent=r+1;b.disabled=lock;b.addEventListener('click',()=>{curRegion=r;sfx('ui');renderLevels();});tabs.appendChild(b);}
  $('#regionName').textContent=tx(REGIONS[curRegion].name);
  let rs=0;for(let i=curRegion*10;i<curRegion*10+10;i++)rs+=S.stars[i]||0;$('#regionStars').textContent=`★ ${rs}/30`;
  const g=$('#levelGrid');g.innerHTML='';
  for(let i=curRegion*10;i<curRegion*10+10;i++){const locked=i>=S.unlocked,st=S.stars[i]||0,b=document.createElement('button');
    b.className='ltile'+(locked?' locked':'')+(i===S.sel?' sel':'')+(i%10===9?' boss':'');b.disabled=locked;
    b.innerHTML=`${i%10===9?CROWN:''}<span class="n">${i+1}</span><span class="st">${[0,1,2].map(j=>`<svg class="${j<st?'on':''}" viewBox="0 0 24 24"><path d="${STAR}"/></svg>`).join('')}</span>`;
    b.addEventListener('click',()=>{S.sel=i;save();sfx('ui');renderLevels();});g.appendChild(b);}
  renderInfo();
}
function renderInfo(){
  const i=S.sel,lv=getLevel(i),box=$('#lvlInfo'),inRegion=Math.floor(i/10)===curRegion;
  if(!inRegion){box.hidden=true;return;}box.hidden=false;
  const mods=lv.mods.map(m=>`<span class="mod" title="${tx(MODS[m].desc)}">${tx(MODS[m].name)}: ${tx(MODS[m].desc)}</span>`).join('');
  box.innerHTML=`<canvas></canvas><h3>${t('levelN',i+1)} · ${lv.name}</h3><div class="meta">${wavesLabel(lv.waves)} · ${t('plotsN',lv.maxP)} · ★ ${S.stars[i]||0}/3</div><div class="mods">${lv.boss?`<span class="mod boss">${t('bossLvl')}</span>`:''}${mods||(!lv.boss?`<span class="meta">${t('noMods')}</span>`:'')}</div><span></span><button class="btn go" id="goBtn">${t('startBtn')}</button>${APP?`<button class="btn ghost go2" id="goAdBtn">${t('goldBtn',bonusGold(i))}${adBadge()}</button>`:''}`;
  drawPreview(box.querySelector('canvas'),i);
  $('#goBtn').addEventListener('click',()=>{ensureAudio();sfx('ui');startLevel(i);});
  if(APP)$('#goAdBtn').addEventListener('click',()=>{ensureAudio();sfx('ui');watchAd('gold',ok=>{startLevel(i);if(ok){G.gold+=bonusGold(i);banner(t('goldN',bonusGold(i)),'');}});});
}
function drawPreview(cv,i){
  const d=Math.min(2,devicePixelRatio||1),w=64,h=92;cv.width=w*d;cv.height=h*d;const g=cv.getContext('2d');g.scale(d,d);
  const lv=getLevel(i),th=themeOf(lv.theme),k=Math.min(w/COLS,h/ROWS),ox=(w-k*COLS)/2,oy=(h-k*ROWS)/2;g.fillStyle=th.g[0];g.fillRect(0,0,w,h);
  const r=rng32(i+3);for(let j=0;j<26;j++){g.fillStyle=th.p[j%th.p.length];g.beginPath();g.arc(r()*w,r()*h,2+r()*3,0,7);g.fill();}
  g.strokeStyle=th.road[1];g.lineWidth=k*.75;g.lineJoin='round';g.beginPath();lv.path.forEach(([c,rr2],j)=>{const x=ox+(c+.5)*k,y=oy+(rr2+.5)*k;j?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
  const last=lv.path[lv.path.length-1];g.fillStyle='#c8c0ae';g.fillRect(ox+(last[0]+.5)*k-k*.7,oy+(last[1]+.5)*k-k*.7,k*1.4,k*1.4);g.fillStyle='#6ff0c8';g.beginPath();g.arc(ox+(last[0]+.5)*k,oy+(last[1]+.5)*k,k*.35,0,7);g.fill();
}
/* upgrades screen */
function renderUpg(){
  const avail=totalStars()-spentStars();$('#upStars').textContent=avail;
  const box=$('#upgList');box.innerHTML='';
  UPGS.forEach(u=>{const r=upr(u.id),cost=r+1,full=r>=UPG_MAX,row=document.createElement('div');row.className='upg';
    row.innerHTML=`<b>${tx(u.name)}</b><span class="d">${tx(u.desc)}</span><span class="pips">${Array.from({length:UPG_MAX},(_,j)=>`<i class="${j<r?'on':''}"></i>`).join('')}</span><button ${full||avail<cost?'disabled':''}>${full?t('maxed'):`${STARSVG}${cost}`}</button>`;
    row.querySelector('button').addEventListener('click',()=>{if(full||totalStars()-spentStars()<cost)return;S.upg[u.id]=r+1;save();sfx('upgrade');renderUpg();});box.appendChild(row);});
  $('#upgReset').disabled=spentStars()===0;
}
$('#upgReset').addEventListener('click',()=>{S.upg={};save();sfx('sell');renderUpg();});
function startLevel(i){
  newGame(i,false);closeSheets();showScreen(null);
  for(const k in hudCache)delete hudCache[k];waveKey='';lastGold=-1;lastHeroKey='';
  buildSkills();buildTowerList();setSpeed(1);
  const lv=G.lv;
  banner(lv.name,`${t('levelN',i+1)} · ${wavesLabel(lv.waves)}`);
  const msgs=[];const nt=TORDER.find(k=>TOWERS[k].unlock===i&&i>0);if(nt)msgs.push([t('newDef'),tx(TOWERS[nt].name)+' — '+tx(TOWERS[nt].desc)]);
  if(lv.boss)msgs.push([t('bossLvl'),t('bossWarn')]);
  lv.mods.forEach(m=>msgs.push([tx(MODS[m].name),tx(MODS[m].desc)]));
  msgs.forEach(([a,b],k)=>setTimeout(()=>{if(G&&G.L===i&&!G.demo&&G.wave===0)banner(a,b);},2500*(k+1)));
  showHint(i===0&&!S.seenTut?t('tutBuild'):null);
}
function endLevel(win){
  if(!G||G.demo)return;
  const stars=win?(G.lives>=G.maxLives?3:G.lives>=G.maxLives*.5?2:1):0;
  if(win){S.stars[G.L]=Math.max(S.stars[G.L]||0,stars);S.unlocked=Math.max(S.unlocked,Math.min(NLEV,G.L+2));S.sel=Math.min(NLEV-1,G.L+1);curRegion=Math.floor(S.sel/10);sfx('win');}else sfx('lose');
  save();closeSheets();G.targeting=null;showHint(null);
  const last=G.L===NLEV-1,tt=$('#endTitle');
  tt.textContent=win?(last?t('winAll'):t('win')):t('lose');tt.className='scr-title'+(win?'':' lose');
  $('#endStars').innerHTML=[0,1,2].map(j=>`<svg class="${j<stars?'on':''}" viewBox="0 0 24 24"><path d="${STAR}"/></svg>`).join('');
  $('#endSub').textContent=win?(last?t('winAllSub'):stars<3?t('win12'):t('win3')):t('loseSub',G.wave,G.waves);
  $('#endStats').innerHTML=`<div class="chip"><span>${t('kills')}</span><b>${G.kills}</b></div><div class="chip"><span>${t('livesL')}</span><b>${G.lives}/${G.maxLives}</b></div><div class="chip"><span>${tx(HEROES[G.hero.type].name)}</span><b>${t('heroLv',G.hero.lvl)}</b></div>`;
  $('#nextBtn').hidden=!(win&&!last);
  const xb=$('#xpAdBtn'),xg=Math.round(G.xpEarned||0);xb.hidden=!(APP&&win&&xg>0);xb.disabled=false;
  if(!xb.hidden){xb.innerHTML=t('xpBtn',xg)+adBadge();xb.onclick=()=>{xb.disabled=true;watchAd('xp',ok=>{if(ok){S.xp[G.hero.type]=(S.xp[G.hero.type]||0)+xg;save();xb.textContent=t('xpDone');sfx('level');}else xb.disabled=false;});};}
  showScreen('endScr');
}
function setSpeed(s){if(G)G.speed=s;$('#speedBtn').textContent='×'+s;}
function soundLabel(){const a=t(S.sound?'sfxOn':'sfxOff'),b=t(S.music?'musOn':'musOff');$('#soundBtn').textContent=a;$('#soundBtn2').textContent=a;$('#musicBtn').textContent=b;$('#musicBtn2').textContent=b;}
function toggleSound(){S.sound=!S.sound;save();soundLabel();ensureAudio();busLevels();sfx('ui');}

$('#musicBtn').addEventListener('click',toggleMusic);$('#musicBtn2').addEventListener('click',toggleMusic);

document.addEventListener('visibilitychange',()=>{if(adShowing)return;if(document.hidden){pauseGame();try{AU.ctx&&AU.ctx.suspend();}catch(e){}}else{try{AU.ctx&&AU.ctx.resume();}catch(e){}}});
/* ---- ads & purchases (only inside the Android app; window.AndroidApp is injected by the native shell) ---- */
const STORE={adFree:false,price:''};let adShowing=false;const rewardCbs={};
const bonusGold=i=>100+5*Math.min(i,60);
const adBadge=()=>STORE.adFree?'':`<span class="ad-badge"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>${t('adTag')}</span>`;
function appCall(fn,dflt){try{return APP?fn():dflt;}catch(e){return dflt;}}
function renderStoreBtns(){
  const rb=$('#removeAdsBtn'),pb=$('#privacyBtn');
  rb.hidden=!APP||STORE.adFree;if(!rb.hidden)rb.textContent=t('removeAds')+(STORE.price?' · '+STORE.price:'');
  pb.hidden=!appCall(()=>APP.privacyRequired(),false);
}
function audioHold(on){try{if(!AU.ctx)return;on?AU.ctx.suspend():AU.ctx.resume();}catch(e){}}
function watchAd(tag,cb){
  if(!APP){cb(false);return;}
  if(STORE.adFree){cb(true);return;}
  rewardCbs[tag]=cb;adShowing=true;audioHold(true);
  if(!appCall(()=>{APP.rewarded(tag);return true;},false)){adShowing=false;audioHold(false);delete rewardCbs[tag];cb(false);}
}
window.__onRewarded=function(tag,ok){adShowing=false;audioHold(false);const cb=rewardCbs[tag];delete rewardCbs[tag];if(!ok)showHint(t('adFail')),setTimeout(()=>showHint(null),2500);if(cb)cb(!!ok);};
function maybeInterstitial(){
  if(!APP||STORE.adFree||!G||G.demo)return;
  S.ends=(S.ends||0)+1;save();
  if(G.L<4||S.ends%3!==0)return;
  adShowing=true;audioHold(true);if(!appCall(()=>{APP.interstitial();return true;},false)){adShowing=false;audioHold(false);}
}
window.__onInterDone=function(){adShowing=false;audioHold(false);};
window.__onStore=function(adFree,price,fresh){const was=STORE.adFree;STORE.adFree=!!adFree;STORE.price=price||'';renderStoreBtns();if(STORE.adFree&&!was&&fresh)banner(t('adFreeThanks'),'');if(!$('#levels').hidden)renderInfo();};
function offerRevive(){
  G.paused=true;closeSheets();
  $('#reviveScr').querySelector('p').textContent=t(STORE.adFree?'reviveSFree':'reviveS');
  $('#reviveBtn').innerHTML=t('reviveBtn')+adBadge();$('#reviveBtn').disabled=false;
  showScreen('reviveScr');
}
$('#reviveBtn').addEventListener('click',()=>{$('#reviveBtn').disabled=true;watchAd('revive',ok=>{
  if(!ok){$('#reviveBtn').disabled=false;return;}
  G.revived=true;G.over=false;G.lives=5;G.paused=false;
  const total=G.path.total;for(const e of G.enemies)if(e.d>total-4&&!ENEMIES[e.type].boss){e.dead=true;smokeFx(e.x,e.y,3,.2);}else if(e.d>total-4)e.d=total-4;
  const c=castlePos();ringFx(c.x,c.y,'#6ff0c8',.2,3,.7,.12);sfx('level');showScreen(null);
});});
$('#giveUpBtn').addEventListener('click',()=>{sfx('ui');G.paused=false;endLevel(false);});
$('#removeAdsBtn').addEventListener('click',()=>{sfx('ui');appCall(()=>APP.buyRemoveAds());});
$('#privacyBtn').addEventListener('click',()=>{sfx('ui');appCall(()=>APP.privacyOptions());});
/* hooks for the Android app shell */
window.__appPause=function(){if(!adShowing)pauseGame();};
window.__appBack=function(){
  if(!$('#reviveScr').hidden)return true;
  if(!$('#endScr').hidden){toMenu('levels');return true;}
  if(!$('#pauseScr').hidden){G.paused=false;showScreen(null);return true;}
  if(!$('#levels').hidden||!$('#upgScr').hidden){showScreen('menu');return true;}
  if(G&&!G.demo&&!G.over){if(G.targeting!==null&&G.targeting!==undefined){G.targeting=null;showHint(null);return true;}if(!$('#buildSheet').hidden||!$('#towerSheet').hidden){closeSheets();return true;}pauseGame();return true;}
  return false;
};

/* ================= boot & loop ================= */
function resize(){const r=$('#stage').getBoundingClientRect();W=Math.max(1,Math.floor(r.width));H=Math.max(1,Math.floor(r.height));DPR=Math.min(2,window.devicePixelRatio||1);fxc.width=W*DPR;fxc.height=H*DPR;if(V.ready){V.r.setSize(W,H,false);fitCamera();}}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&!G.paused){for(let i=0;i<(G.demo?1:G.speed);i++)update(dt);}
  render3D(now/1000,dt);
  if(G&&!G.demo)uiTick();
  requestAnimationFrame(frame);
}
if(APP){STORE.adFree=!!appCall(()=>APP.isAdFree(),false);STORE.price=appCall(()=>APP.removeAdsPrice(),'')||'';}
applyLang();
init3D();
resize();
new ResizeObserver(resize).observe($('#stage'));
newGame(demoLevel(),true);
showScreen('menu');
requestAnimationFrame(frame);
</script>
