<title>Jay Moves Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#141820;--fg:#f3efe6;--mut:#a9b1bd;--acc:#ffcf4a;--chip:#232a36;--chipOn:#ffcf4a;--chipOnFg:#1a1a1a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;min-height:0}
#stage canvas{display:block;width:100%;height:100%}
#bar{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:#0d1016;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
button{font:inherit;border:0;border-radius:12px;cursor:pointer}
.move{background:linear-gradient(#ffd86a,#f0a72a);color:#2a1700;font-weight:800;padding:10px 14px;font-size:15px;box-shadow:0 3px 0 #9c5d10}
.move:active{transform:translateY(2px);box-shadow:0 1px 0 #9c5d10}
.chip{background:var(--chip);color:var(--mut);padding:5px 10px;font-size:12px}
.chip.on{background:var(--chipOn);color:var(--chipOnFg);font-weight:700}
.lbl{font-size:12px;color:var(--mut)}
#comic{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ctext{position:absolute;font-weight:900;font-size:44px;color:#ffe066;-webkit-text-stroke:3px #3a1500;text-shadow:0 4px 0 #3a1500;transform:translate(-50%,-50%) scale(.2) rotate(-8deg);animation:pop 1.1s ease-out forwards;white-space:nowrap;font-family:"Arial Black",Impact,sans-serif}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25) rotate(-6deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1.05) rotate(-6deg);opacity:0}}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px}
#title{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));font-size:13px;color:var(--mut);pointer-events:none}
#title b{color:var(--fg)}
</style>
<div id="wrap">
 <div id="stage"><div id="load">Loading…</div><div id="comic"></div><div id="title"><b>Jay — مختبر الحركات</b> · Moves Lab</div></div>
 <div id="bar">
  <div class="row">
   <button class="move" data-m="atk">🏀 رمية</button>
   <button class="move" data-m="s1">🎯 رمية ثلاثية</button>
   <button class="move" data-m="s2">🔁 الكرة المرتدة</button>
   <button class="move" data-m="s3">💥 الدنك</button>
  </div>
  <div class="row" id="opts"></div>
  <div class="row">
   <span class="lbl">الكاميرا:</span><button class="chip on" data-cam="game">مثل اللعبة</button><button class="chip" data-cam="close">قريبة</button>
   <span class="lbl">السرعة:</span><button class="chip on" data-spd="1">عادية</button><button class="chip" data-spd="0.3">بطيئة</button>
   <span class="lbl">اهتزاز:</span><button class="chip on" id="vib">تشغيل</button>
  </div>
 </div>
</div>

<script>

drawOpts();

function b64buf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}

const TX={glow:radTex([[0,'rgba(255,255,255,1)'],[.35,'rgba(255,255,255,.6)'],[1,'rgba(255,255,255,0)']]),smoke:radTex([[0,'rgba(255,255,255,.9)'],[.6,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']])};
TX.star=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.translate(32,32);g.fillStyle='#fff';g.beginPath();for(let i=0;i<10;i++){const r=i%2?11:29,a=i*Math.PI/5-Math.PI/2;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();return new THREE.CanvasTexture(c);})();

// ---------- particles ----------
const P=[];const MAXP=260;
function part(o){if(P.length>=MAXP)return null;const mat=new THREE.SpriteMaterial({map:TX[o.tex||'glow'],color:o.color||'#fff',transparent:true,depthWrite:false,blending:o.add?THREE.AdditiveBlending:THREE.NormalBlending,opacity:o.op??1,rotation:Math.random()*6});const s=new THREE.Sprite(mat);s.position.set(o.x,o.y,o.z);s.scale.setScalar(o.size||.3);scene.add(s);const p=Object.assign({s,vx:0,vy:0,vz:0,g:0,life:.5,t:0,grow:0,drag:0,op0:o.op??1,spin:0},o);P.push(p);return p;}
function updParts(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t>=p.life){scene.remove(p.s);p.s.material.dispose();P.splice(i,1);continue;}
 p.vy-=p.g*dt;const d=Math.max(0,1-p.drag*dt);p.vx*=d;p.vy*=d;p.vz*=d;p.s.position.x+=p.vx*dt;p.s.position.y+=p.vy*dt;p.s.position.z+=p.vz*dt;if(p.s.position.y<.02){p.s.position.y=.02;p.vy=Math.abs(p.vy)*.3;}
 const k=p.t/p.life;p.s.scale.setScalar(p.size*(1+p.grow*k));p.s.material.opacity=p.op0*(k<.15?k/.15:1-(k-.15)/.85);p.s.material.rotation+=p.spin*dt;if(p.col2){p.s.material.color.lerpColors(new THREE.Color(p.color),new THREE.Color(p.col2),k);}}}
// flat rings / shockwaves
const RINGS=[];function ring(x,z,col,r0,r1,life,w){const g=new THREE.RingGeometry(1-(w||.25),1,48);const m=new THREE.MeshBasicMaterial({color:col,transparent:true,depthWrite:false,side:THREE.DoubleSide});const me=new THREE.Mesh(g,m);me.rotation.x=-Math.PI/2;me.position.set(x,.05,z);scene.add(me);RINGS.push({me,r0,r1,life,t:0,w:w||.25});}
function updRings(dt){for(let i=RINGS.length-1;i>=0;i--){const r=RINGS[i];r.t+=dt;const k=r.t/r.life;if(k>=1){scene.remove(r.me);r.me.geometry.dispose();RINGS.splice(i,1);continue;}const e=1-Math.pow(1-k,3);const rad=r.r0+(r.r1-r.r0)*e;r.me.scale.setScalar(rad);r.me.material.opacity=(1-k)*.9;}}
function comic(txt,x,y,z,size,col){const v=new THREE.Vector3(x,y,z).project(cam);const el=document.createElement('div');el.className='ctext';el.textContent=txt;el.style.left=((v.x+1)/2*100)+'%';el.style.top=((1-v.y)/2*100)+'%';if(size)el.style.fontSize=size+'px';if(col)el.style.color=col;document.getElementById('comic').appendChild(el);setTimeout(()=>el.remove(),1150);}
// fx helpers
function dust(x,z,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=.6+Math.random()*1.4;part({tex:'smoke',add:false,color:col||'#d9c39a',x,y:.15,z,vx:Math.cos(a)*s,vz:Math.sin(a)*s,vy:.4+Math.random()*.6,drag:2.5,size:.35,grow:1.4,life:.55+Math.random()*.3,op:.75});}}
function sparks(x,y,z,n,col,sp,col2){for(let i=0;i<n;i++){const a=Math.random()*6.28,b=Math.random()*1.2,s=sp*(.5+Math.random());part({color:col,col2,x,y,z,vx:Math.cos(a)*s*Math.cos(b),vz:Math.sin(a)*s*Math.cos(b),vy:Math.sin(b)*s+1,g:6,drag:1.5,size:.16+Math.random()*.1,life:.35+Math.random()*.3});}}
function fireBurst(x,y,z,n,scale){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(1+Math.random()*2.2)*scale;part({color:'#ffd23a',col2:'#d82400',x,y,z,vx:Math.cos(a)*s,vz:Math.sin(a)*s,vy:1+Math.random()*2.5*scale,drag:3,size:.45*scale,grow:1.2,life:.45+Math.random()*.25});}
 for(let i=0;i<Math.ceil(n/3);i++){part({tex:'smoke',add:false,color:'#2a2522',x:x+(Math.random()-.5)*.6*scale,y:y+.3,z:z+(Math.random()-.5)*.6*scale,vy:1.2+Math.random(),drag:1,size:.5*scale,grow:1.6,life:.9+Math.random()*.4,op:.55});}}

// ---------- camera shake ----------
let shakeT=0,shakeA=0;function shake(a,t){shakeA=Math.max(shakeA,a);shakeT=Math.max(shakeT,t);}
let hitStop=0;

// ---------- tweens ----------
const TW=[];function tween(dur,fn,done){TW.push({t:0,dur,fn,done});}
function updTw(dt){for(let i=TW.length-1;i>=0;i--){const w=TW[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){TW.splice(i,1);w.done&&w.done();}}}
// ---------- speed lines (anime) ----------
const LINES=[];const lineMatCache={};
function speedLine(p,vel,len,col,life){if(LINES.length>90)return;const v=vel.clone().normalize();const off=new THREE.Vector3((Math.random()-.5)*.25,(Math.random()-.5)*.25,(Math.random()-.5)*.25);
 const a=p.clone().add(off),b=a.clone().addScaledVector(v,-len);const g=new THREE.BufferGeometry().setFromPoints([a,b]);const m=new THREE.LineBasicMaterial({color:col||'#ffffff',transparent:true,depthWrite:false});const l=new THREE.Line(g,m);scene.add(l);LINES.push({l,t:0,life:life||.18});}
function updLines(dt){for(let i=LINES.length-1;i>=0;i--){const L=LINES[i];L.t+=dt;const k=L.t/L.life;if(k>=1){scene.remove(L.l);L.l.geometry.dispose();L.l.material.dispose();LINES.splice(i,1);continue;}L.l.material.opacity=1-k;}}
// ---------- vortex rings around the flying ball ----------
const VX=[];function vortexRing(p,vel,col,r){if(VX.length>40)return;const g=new THREE.TorusGeometry(1,.07,6,28);const m=new THREE.MeshBasicMaterial({color:col,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});const me=new THREE.Mesh(g,m);me.position.copy(p);me.lookAt(p.clone().add(vel));me.scale.setScalar(r*.4);scene.add(me);VX.push({me,t:0,life:.35,r,spin:(Math.random()<.5?-1:1)*9});}
function updVx(dt){for(let i=VX.length-1;i>=0;i--){const v=VX[i];v.t+=dt;const k=v.t/v.life;if(k>=1){scene.remove(v.me);v.me.geometry.dispose();v.me.material.dispose();VX.splice(i,1);continue;}v.me.scale.setScalar(v.r*(.4+k*.9));v.me.rotateZ(v.spin*dt);v.me.material.opacity=(1-k)*.95;}}
// ---------- anime cut-in: radial speed lines over the screen ----------
const cut=document.createElement('canvas');cut.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';document.getElementById('stage').appendChild(cut);let cutT=0,cutC=null,cutCol='#fff';
function cutIn(x,y,z,col,dur){cutT=dur||.5;cutCol=col||'#fff';cutC=new THREE.Vector3(x,y,z);}
function drawCut(dt){const w=cut.clientWidth,h=cut.clientHeight;if(cut.width!==w)cut.width=w;if(cut.height!==h)cut.height=h;const g=cut.getContext('2d');g.clearRect(0,0,w,h);if(cutT<=0)return;cutT-=dt;
 const v=cutC.clone().project(cam);const cx=(v.x+1)/2*w,cy=(1-v.y)/2*h;const R=Math.hypot(w,h);g.save();g.globalAlpha=Math.min(1,cutT*4)*.6;g.fillStyle=cutCol;
 for(let i=0;i<45;i++){const a=Math.random()*6.283,r0=R*(.18+Math.random()*.15),wd=.004+Math.random()*.01;g.beginPath();g.moveTo(cx+Math.cos(a-wd)*R,cy+Math.sin(a-wd)*R);g.lineTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);g.lineTo(cx+Math.cos(a+wd)*R,cy+Math.sin(a+wd)*R);g.fill();}g.restore();}
// ---------- actors ----------
let hero,hRoot,flipG,mix,clips={},heroImpact={},ball,ballState=null,gobSrc;
const enemies=[];const EPOS=[[2.8,0],[3.3,-.8],[3.6,.8]];
function makeEnemy(i){const g=new THREE.Group();const inner=THREE.SkeletonUtils.clone(gobSrc.scene);inner.scale.setScalar(gobSrc.sc);g.add(inner);g.rotation.y=-Math.PI/2;const [x,z]=EPOS[i];g.position.set(x+2.5,0,z);scene.add(g);const mx=new THREE.AnimationMixer(inner);const a=mx.clipAction(gobSrc.clip);a.play();a.timeScale=.6;
 const mats=[];inner.traverse(o=>{if(o.isMesh){o.material=o.material.clone();mats.push(o.material);}});
 const st=new THREE.Group();for(let k=0;k<3;k++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TX.star,color:'#ffe066',transparent:true,depthWrite:false}));s.scale.setScalar(.22);st.add(s);}st.visible=false;scene.add(st);
 return {g,inner,mx,mats,i,home:[x,z],vx:0,vy:0,vz:0,air:false,squash:0,flash:0,starT:0,st,state:'walkin',alpha:1,spin:0};}
function hitEnemy(e,dir,pow,up,opt={}){e.flash=.18;e.squash=.25;e.vx=dir[0]*pow;e.vz=dir[1]*pow;e.vy=up;e.air=up>0;e.spin=opt.spin||0;if(opt.stars)e.starT=1.6;e.state='hit';e.hitT=0;}
function updEnemies(dt){for(const e of enemies){e.mx.update(dt);const g=e.g;
 if(e.state==='walkin'){const [hx,hz]=e.home;g.position.x+=(hx-g.position.x)*Math.min(1,dt*2.5);g.position.z+=(hz-g.position.z)*Math.min(1,dt*2.5);if(Math.abs(g.position.x-hx)<.02)e.state='idle';}
 else if(e.state==='hit'){e.hitT+=dt;g.position.x+=e.vx*dt;g.position.z+=e.vz*dt;const d=Math.max(0,1-4*dt);if(!e.air){e.vx*=d;e.vz*=d;}else{e.vy-=18*dt;g.position.y+=e.vy*dt;g.rotation.z+=e.spin*dt;if(g.position.y<=0){g.position.y=0;e.air=false;e.vy=0;dust(g.position.x,g.position.z,5);g.rotation.z=0;e.squash=.2;}}

 // squash & stretch

// ---------- ball ----------
function heroFootPos(){const v=new THREE.Vector3();const f=hero.getObjectByName('RightToeBase')||hero.getObjectByName('RightFoot');f.getWorldPosition(v);return v;}
let dribSign=0;const _q=new THREE.Quaternion(),_pq=new THREE.Quaternion();
